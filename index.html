<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#053f47"><title>ABSCISAR QR | Topografía</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#12343b;background:#edf5f6}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px}.panel{width:min(100%,540px);background:white;border-radius:22px;box-shadow:0 12px 50px #073c4720;padding:clamp(20px,5vw,38px)}.logo{display:block;width:min(100%,310px);margin:0 auto 12px}h1{font-size:24px;margin:10px 0 5px;text-align:center;color:#063f47}.sub{text-align:center;color:#53737a;margin:0 0 26px;font-size:14px}label{display:block;font-weight:700;font-size:14px;margin-bottom:9px}input{width:100%;padding:15px;border:1px solid #b7cfd2;border-radius:11px;font-size:15px;outline:none}input:focus{border-color:#069bd1;box-shadow:0 0 0 3px #069bd125}button{width:100%;border:0;border-radius:11px;background:#069bd1;color:white;font-weight:750;font-size:16px;padding:15px;cursor:pointer;margin-top:14px}button:hover{background:#007fae}button:disabled{background:#b2c6cb;cursor:not-allowed}.download{background:#06464c}.download:hover{background:#032f34}.preview{background:#f4fafb;border:1px dashed #bad3d7;border-radius:15px;margin-top:20px;padding:20px;display:flex;align-items:center;justify-content:center;min-height:270px;flex-direction:column;gap:12px}canvas{max-width:100%;height:auto;background:white;border-radius:8px}.hint{color:#648188;font-size:13px;text-align:center;margin:0}.error{color:#b3261e;font-size:13px;margin:9px 0 0;min-height:18px}.foot{text-align:center;font-size:12px;color:#708b90;margin:20px 0 0}#work{display:none}
</style></head><body><main class="panel"><img src="logo.png" alt="ABSCISAR TOPOGRAFÍA" class="logo"><h1>Generador de códigos QR</h1><p class="sub">Acceso digital a los productos de tus proyectos</p><label for="link">Enlace de la carpeta de Google Drive</label><input id="link" type="url" inputmode="url" placeholder="https://drive.google.com/drive/folders/..." autocomplete="url"><p id="error" class="error" role="alert"></p><button id="generate">Generar código QR</button><section class="preview" aria-label="Vista previa del código QR"><canvas id="preview" width="800" height="800" hidden></canvas><p id="empty" class="hint">Tu código QR aparecerá aquí</p></section><button id="download" class="download" disabled>Descargar JPG</button><p class="foot">ABSCISAR TOPOGRAFÍA · El enlace se procesa en tu navegador.</p><div id="work"></div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const link=document.getElementById('link'),error=document.getElementById('error'),preview=document.getElementById('preview'),empty=document.getElementById('empty'),download=document.getElementById('download'),work=document.getElementById('work');
function generate(){error.textContent='';download.disabled=true;preview.hidden=true;empty.hidden=false;const value=link.value.trim();let url;try{url=new URL(value);if(!['https:','http:'].includes(url.protocol))throw Error();}catch{error.textContent='Ingresa un enlace válido que comience con https://';return;}if(!/^([a-z0-9-]+\.)?drive\.google\.com$|^docs\.google\.com$/i.test(url.hostname)){error.textContent='Ingresa un enlace de Google Drive.';return;}if(typeof QRCode==='undefined'){error.textContent='No se pudo cargar el generador QR. Comprueba tu conexión a internet.';return;}work.innerHTML='';new QRCode(work,{text:value,width:700,height:700,colorDark:'#073e46',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H});const img=work.querySelector('img');const qrCanvas=work.querySelector('canvas');const render=()=>{const ctx=preview.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,800,800);if(qrCanvas&&qrCanvas.width){ctx.drawImage(qrCanvas,50,50,700,700);}else if(img&&img.complete&&img.naturalWidth){ctx.drawImage(img,50,50,700,700);}else{error.textContent='No se pudo generar el código QR.';return;}preview.hidden=false;empty.hidden=true;download.disabled=false;};if(qrCanvas&&qrCanvas.width){render();}else if(img){img.onload=render;if(img.complete&&img.naturalWidth)render();}else{error.textContent='No se pudo generar el código QR.';}}
document.getElementById('generate').addEventListener('click',generate);link.addEventListener('keydown',e=>{if(e.key==='Enter')generate()});link.addEventListener('input',()=>{download.disabled=true;preview.hidden=true;empty.hidden=false;error.textContent=''});download.addEventListener('click',()=>{if(download.disabled)return;const a=document.createElement('a');a.href=preview.toDataURL('image/jpeg',0.96);a.download='ABSCISAR_QR.jpg';a.click();});
</script></body></html>
